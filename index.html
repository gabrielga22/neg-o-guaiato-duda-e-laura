<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Pine County: A Casa Velha da Colina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
 
    body {
      background-color: #030304;
      color: #c8c3c3;
      font-family: 'Special Elite', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }
 
    /* Efeito Overlay CRT / Scanline de tela retro */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 100;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }
 
    /* Vinheta sombria de lanterna / escuridão */
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(20, 15, 15, 0.2) 0%, rgba(0, 0, 0, 0.85) 70%, rgba(0, 0, 0, 0.98) 100%);
      pointer-events: none;
      z-index: 10;
    }
 
    /* Container Principal */
    .game-container {
      width: 92%;
      max-width: 820px;
      background: #0a090b;
      border: 2px solid #2e1a1a;
      box-shadow: 0 0 35px rgba(139, 0, 0, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.9);
      border-radius: 4px;
      padding: 35px;
      position: relative;
      z-index: 20;
      margin: 20px 0;
    }
 
    /* Título do Capítulo */
    .header-title {
      font-family: 'Creepster', cursive;
      color: #8b0000;
      font-size: 2.3rem;
      letter-spacing: 2px;
      text-align: center;
      text-shadow: 2px 2px 4px #000000, 0 0 12px rgba(139, 0, 0, 0.6);
      border-bottom: 1px dashed #3a1e1e;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }
 
    .chapter-tag {
      font-size: 0.85rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 8px;
    }
 
    /* Caixa de Texto de Diálogo */
    .textbox {
      background: #050507;
      border: 1px solid #1c1515;
      padding: 28px;
      min-height: 230px;
      line-height: 1.8;
      font-size: 1.05rem;
      color: #d1cccc;
      margin-bottom: 25px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.95);
      position: relative;
    }
 
    .textbox p {
      margin-bottom: 14px;
    }
 
    .highlight {
      color: #a93226;
      font-weight: bold;
      text-shadow: 0 0 6px rgba(169, 50, 38, 0.5);
    }
 
    .whisper {
      font-style: italic;
      color: #888899;
      padding-left: 15px;
      border-left: 2px solid #552222;
      margin: 10px 0;
    }
 
    /* Cursor piscante da máquina de escrever */
    .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background-color: #8b0000;
      margin-left: 4px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }
 
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
 
    /* Opções e Botões de Escolha */
    .choices-title {
      font-size: 0.85rem;
      color: #773333;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
 
    .choice-btn {
      display: block;
      width: 100%;
      background: #120e0f;
      color: #b0a8a8;
      border: 1px solid #331f1f;
      padding: 15px 20px;
      margin-bottom: 12px;
      font-family: 'Special Elite', monospace;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
 
    .choice-btn:hover {
      background: #221012;
      color: #ff4d4d;
      border-color: #8b0000;
      box-shadow: 0 0 12px rgba(139, 0, 0, 0.4);
      padding-left: 25px;
    }
 
    .choice-btn::before {
      content: ">";
      margin-right: 10px;
      color: #8b0000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
 
    .choice-btn:hover::before {
      opacity: 1;
    }
 
    /* Barra de Status */
    .status-bar {
      margin-top: 25px;
      font-size: 0.8rem;
      color: #555;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #1a1414;
      padding-top: 12px;
    }
 
    .pulse {
      animation: pulse-animation 2.5s infinite;
    }
 
    @keyframes pulse-animation {
      0% { opacity: 0.7; }
      50% { opacity: 1; text-shadow: 0 0 8px rgba(255, 0, 0, 0.8); }
      100% { opacity: 0.7; }
    }
  </style>
</head>
<body>
 
  <div class="overlay"></div>
 
  <div class="game-container">
    <div class="chapter-tag">Black Pine County • Ano: 2003</div>
    <div class="header-title">A CASA VELHA DA COLINA</div>
 
    <div class="textbox" id="text-display">
      <div id="typed-content"></div><span class="cursor" id="cursor"></span>
    </div>
 
    <div id="choices-container">
      <div class="choices-title" id="choices-label" style="display: none;">Escolha o seu próximo passo:</div>
      <div id="buttons-group"></div>
    </div>
 
    <div class="status-bar">
      <span id="status-location">Local: Entrada de Black Pine County</span>
      <span id="status-time">Horário: 02:17 AM</span>
    </div>
  </div>
 
  <script>
    const storyNodes = {
      scene1: {
        location: "A Chegada a Black Pine County",
        text: `<p>Ano: 2003.</p>
               <p>Tudo começou com as cartas. Moradores de uma região isolada chamada <span class="highlight">Black Pine County</span> enviaram relatos perturbadores:</p>
               <p class="whisper">• Vozes sussurrando de dentro das paredes...<br>
                  • Pessoas desaparecendo sem deixar rastro...<br>
                  • Luzes estranhas dançando no meio da floresta...</p>
               <p>E, no centro de tudo, uma casa abandonada onde ninguém tem coragem de pisar há décadas. A antiga propriedade da <span class="highlight">Família Vidal</span> — desaparecida em 1978 após um suposto ritual coletivo.</p>
               <p>Agora, numa noite chuvosa e gélida, os quatro investigadores chegam ao local.</p>`,
        choices: [
          { text: "Aproximar-se da mansão sob a chuva", target: "scene2" }
        ]
      },
      scene2: {
        location: "O Varandão da Mansão Vidal",
        text: `<p>A chuva cai pesada contra o teto do carro. Vocês sobem os degraus de madeira podre do varandão.</p>
               <p>A casa não parece apenas abandonada... <span class="highlight pulse">ela parece viva.</span></p>
               <p>As tábuas rangem sob os pés mesmo quando o vento cessa. Estranhamente, todos os relógios que vocês encontram no corredor de entrada estão parados exatamente às <span class="highlight">02:17</span>.</p>
               <p>Símbolos bizarros estão riscados por toda parte: nas paredes, nas portas e nos quadros antigos.</p>
               <p>O grupo decide se dividir para cobrir mais terreno.</p>`,
        choices: [
          { text: "Controlar Lucas e explorar os barulhos no porão", target: "scene_lucas" },
          { text: "Controlar Evelyn e examinar os símbolos no andar superior", target: "scene_evelyn" }
        ]
      },
      scene_lucas: {
        location: "Porão da Mansão Vidal",
        text: `<p class="highlight">PERSPECTIVA: LUCAS</p>
               <p>Lucas desce os degraus rangentes em direção ao porão. O ar é pesado, com cheiro de umidade e algo queimado.</p>
               <p>Ao mover uma estante pesada coberta de teias de aranha, ele encontra algo...</p>
               <p>Uma passagem secreta revelando uma câmara oculta. No chão, um círculo ritualístico cercado por velas derretidas e fotos antigas queimadas.</p>
               <p>No centro, repousa um objeto estranho e inquietante que parece pulsar suavemente...</p>`,
        choices: [
          { text: "Tocar no objeto misterioso", target: "scene_end" },
          { text: "Chamar os outros investigadores imediatamente", target: "scene_end" }
        ]
      },
      scene_evelyn: {
        location: "Segundo Andar da Mansão Vidal",
        text: `<p class="highlight">PERSPECTIVA: EVELYN</p>
               <p>Evelyn sobe a escadaria vitoriana. Os retratos da família Vidal parecem acompanhar cada movimento seu com os olhos.</p>
               <p>Enquanto examina os símbolos entalhados no batente de um quarto, ela ouve um baque seco vindo lá de baixo, seguido pelo grito abafado de Lucas no porão!</p>
               <p>O relógio no corredor começa a ecoar um clique metálico violento, mesmo sem os ponteiros se moverem.</p>`,
        choices: [
          { text: "Correr para o porão para acudir Lucas", target: "scene_end" }
        ]
      },
      scene_end: {
        location: "A Descoberta no Porão",
        text: `<p class="highlight pulse">PRÓLOGO CONCLUÍDO</p>
               <p>O ar da mansão congela instantaneamente. A chama das lanternas oscila até quase apagar.</p>
               <p>Abaixo da casa, o que Lucas encontrou é apenas a primeira peça de um pesadelo muito maior escondido em Black Pine County...</p>
               <p class="whisper">“Conhecimento exige espaço... E a mente humana paga o preço.”</p>`,
        choices: [
          { text: "🔄 Reiniciar o Prólogo", target: "scene1" }
        ]
      }
    };
 
    let typingTimeout;
 
    function typeWriter(htmlText, elementId, callback) {
      const container = document.getElementById(elementId);
      const cursor = document.getElementById('cursor');
      container.innerHTML = '';
      cursor.style.display = 'inline-block';
 
      let i = 0;
      let currentHTML = '';
     
      function type() {
        if (i < htmlText.length) {
          if (htmlText[i] === '<') {
            let tag = '';
            while (htmlText[i] !== '>' && i < htmlText.length) {
              tag += htmlText[i];
              i++;
            }
            tag += '>';
            i++;
            currentHTML += tag;
          } else {
            currentHTML += htmlText[i];
            i++;
          }
          container.innerHTML = currentHTML;
          typingTimeout = setTimeout(type, 12);
        } else {
          cursor.style.display = 'none';
          if (callback) callback();
        }
      }
     
      type();
    }
 
    function renderNode(nodeKey){
 
const node = storyNodes[nodeKey];
 
document.getElementById("status-location").innerText =
"Local: " + node.location;
 
const buttonsGroup = document.getElementById("buttons-group");
const choicesLabel = document.getElementById("choices-label");
 
buttonsGroup.innerHTML = "";
choicesLabel.style.display = "none";
 
typeWriter(node.text,"typed-content",function(){
 
    choicesLabel.style.display="block";
 
    node.choices.forEach(choice=>{
 
        const btn=document.createElement("button");
 
        btn.className="choice-btn";
 
        btn.innerText=choice.text;
 
        btn.onclick=function(){
 
            renderNode(choice.target);
 
        };
 
        buttonsGroup.appendChild(btn);
 
    });
 
});
 
}
window.onload = function(){
renderNode('scene1');
}
  </script>
</body>
</html>
