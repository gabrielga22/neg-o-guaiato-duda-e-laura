<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Price of Knowledge - Iniciar Jogo</title>
    
    <!-- Fonte Cinzel do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Imagem de fundo configurada com o nome exato do arquivo que você enviou */
            background-image: url('1000147916_2.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            color: #e0e0e0;
            font-family: 'Cinzel', 'Georgia', serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Camada escura por cima da imagem para destacar o menu */
        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(10, 10, 15, 0.4) 0%, rgba(2, 2, 5, 0.85) 100%);
            z-index: 1;
        }

        /* Container Principal do Menu com efeito de vidro esfumaçado */
        .menu-container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 50px 40px;
            max-width: 800px;
            width: 90%;
            background: rgba(0, 0, 0, 0.6); 
            border: 1px solid rgba(139, 0, 0, 0.3);
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            backdrop-filter: blur(4px);
        }

        /* Título do Jogo */
        h1 {
            font-size: 3.5rem;
            color: #d12f2f;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(209, 47, 47, 0.8), 2px 2px 5px #000;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #d1d1e0;
            font-style: italic;
            margin-bottom: 50px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 4px #000;
        }

        /* Botão de Iniciar */
        .btn-start {
            display: inline-block;
            padding: 15px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.85) 0%, rgba(74, 0, 0, 0.95) 100%);
            border: 2px solid #b22222;
            border-radius: 4px;
            text-decoration: none;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(139, 0, 0, 0.6);
        }

        .btn-start:hover {
            background: linear-gradient(135deg, rgba(161, 0, 0, 0.95) 0%, rgba(96, 0, 0, 1) 100%);
            border-color: #ff4d4d;
            box-shadow: 0 0 35px rgba(255, 77, 77, 0.9);
            transform: scale(1.05);
        }

        .btn-start:active {
            transform: scale(0.98);
        }

        /* Rodapé estético */
        .footer-note {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            color: #a3a3b5;
            z-index: 2;
            letter-spacing: 2px;
            text-shadow: 1px 1px 3px #000;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .subtitle { font-size: 1rem; }
            .menu-container { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <div class="menu-container">
        <h1>The Price of Knowledge</h1>
        <p class="subtitle">"Toda estrada leva para algum lugar. Algumas só não deixam você voltar."</p>
        
        <!-- Link interligado para o primeiro capítulo do seu jogo -->
        <a href="pag1.html" class="btn-start">Iniciar Jogo</a>
    </div>

    <div class="footer-note">
        Hollow Creek — Est. 1876
    </div>

</body>
</html>
