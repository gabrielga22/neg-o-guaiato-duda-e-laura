<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Pine County - Prólogo</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            margin:0;
            padding:0;

            background-image:url("Mídia.jpg");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            background-attachment:fixed;

            background-color:#000;
            font-family:Georgia, serif;
            color:white;
            overflow:hidden;
        }

        /* Camada escura para deixar o clima mais assustador */
        .overlay{
            width:100%;
            height:100vh;

            background:linear-gradient(
                rgba(0,0,0,.80),
                rgba(0,0,0,.90)
            );

            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;

            padding:30px;

            box-shadow: inset 0 0 250px #000;
        }

        h1{
            color:#b10000;
            font-size:60px;
            margin-bottom:10px;
            text-shadow:0 0 20px #ff0000;
        }

        h2{
            font-size:35px;
            margin-bottom:20px;
        }

        .ano{
            color:#bbb;
            margin-bottom:25px;
            font-size:20px;
        }

        #texto{
            width:80%;
            max-width:900px;
            min-height:220px;
            font-size:24px;
            line-height:40px;
            margin-bottom:30px;
        }

        button{
            padding:15px 45px;
            font-size:20px;
            border:none;
            border-radius:5px;
            cursor:pointer;

            background:#8b0000;
            color:white;

            transition:.3s;
        }

        button:hover{
            background:#4e3838;
            transform:scale(1.05);
        }
    </style>
</head>

<body>

<div class="overlay">

    <h1>PRÓLOGO</h1>

    <h2>A CASA VELHA DA COLINA</h2>

    <p class="ano">Ano: 2003</p>

    <div id="texto"></div>

    <button onclick="proximo()">Continuar</button>

</div>

<script>

const historia = [

"O grupo recebe cartas de moradores de uma região isolada chamada Black Pine County.",

"As cartas falam sobre vozes dentro das paredes.",

"Pessoas desaparecendo misteriosamente.",

"Luzes estranhas aparecem na floresta durante a noite.",

"Existe uma casa abandonada onde ninguém entra há décadas.",

"A casa pertenceu à família Vidal.",

"A família desapareceu em 1978 após um suposto ritual coletivo.",

"Os quatro investigadores chegam durante uma forte tempestade.",

"A casa parece... viva.",

"As tábuas rangem mesmo sem vento.",

"Todos os relógios estão parados exatamente às 02:17.",

"Símbolos estranhos estão riscados nas paredes.",

"Durante a exploração, cada personagem segue por um caminho diferente.",

"Lucas encontra uma escada que leva ao porão.",

"Ele desce lentamente.",

"No fundo do porão existe uma enorme porta de madeira coberta por símbolos.",

"Quando Lucas toca na porta, uma voz ecoa pela escuridão...",

"VOCÊS CHEGARAM TARDE DEMAIS."

];

let indice = 0;

function proximo(){

    if(indice < historia.length){

        document.getElementById("texto").innerHTML = historia[indice];
        indice++;

    }else{

        document.getElementById("texto").innerHTML =
        "<h2>Fim do Prólogo</h2><p>Lucas encara a porta enquanto algo se aproxima na escuridão...</p>";

    }

}

proximo();

</script>

</body>
</html>
